<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品管理 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/crm/admin/index.html">客户信息管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown nav-admin">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-user"></i> <span id="currentUsername">管理员</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/crm/admin/profile.html">个人信息</a>
                        <a class="dropdown-item" href="/crm/admin/change-password.html">修改密码</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 左侧菜单 -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/index.html">
                                控制台
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/admin-list.html">
                                管理员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/salesperson-list.html">
                                销售人员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/customer-list.html">
                                客户管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-category.html">
                                产品类别管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link active" href="/crm/admin/product-list.html">
                                产品管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/order-list.html">
                                订单管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 右侧内容区域 -->
            <main role="main" class="col-md-10 ml-sm-auto main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">产品管理</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-sm btn-primary" id="addProductBtn">
                            <i class="fa fa-plus"></i> 添加产品
                        </button>
                    </div>
                </div>

                <!-- 搜索栏 -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="搜索产品名称">
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary" type="button" id="searchBtn">
                                    <i class="fa fa-search"></i> 搜索
                                </button>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- 数据表格 -->
                <div class="table-responsive">
                    <table class="table table-striped table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>产品编码</th>
                                <th>产品名称</th>
                                <th>类别</th>
                                <th>价格</th>
                                <th>库存</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <!-- 数据将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-end" id="pagination">
                        <!-- 分页将通过JavaScript动态加载 -->
                    </ul>
                </nav>
            </main>
        </div>
    </div>

    <!-- 添加/编辑产品模态框 -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalLabel">添加产品</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="productName">产品名称</label>
                                    <input type="text" class="form-control" id="productName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="productCode">产品编码</label>
                                    <input type="text" class="form-control" id="productCode" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="categoryId">产品类别</label>
                                    <select class="form-control" id="categoryId" required>
                                        <option value="">请选择类别</option>
                                        <!-- 类别选项将通过JavaScript动态加载 -->
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="price">价格</label>
                                    <div class="input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text">¥</span>
                                        </div>
                                        <input type="number" class="form-control" id="price" min="0" step="0.01" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="stock">库存</label>
                                    <input type="number" class="form-control" id="stock" min="0" value="0">
                                </div>
                            </div>

                        </div>
                        
                        <div class="form-group">
                            <label for="description">产品描述</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="specification">规格参数</label>
                            <textarea class="form-control" id="specification" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveProductBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 产品详情模态框 -->
    <div class="modal fade" id="productDetailModal" tabindex="-1" aria-labelledby="productDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productDetailModalLabel">产品详情</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <strong>产品名称：</strong>
                            <span id="detailProductName"></span>
                        </div>
                        <div class="col-md-4">
                            <strong>产品编码：</strong>
                            <span id="detailProductCode"></span>
                        </div>
                        <div class="col-md-4">
                            <strong>产品类别：</strong>
                            <span id="detailCategoryName"></span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <strong>价格：</strong>
                            <span id="detailPrice"></span>
                        </div>
                        <div class="col-md-4">
                            <strong>库存：</strong>
                            <span id="detailStock"></span>
                        </div>

                    </div>
                    <div class="mb-3">
                        <strong>产品描述：</strong>
                        <div id="detailDescription" class="border p-2 mt-1"></div>
                    </div>
                    <div>
                        <strong>规格参数：</strong>
                        <div id="detailSpecification" class="border p-2 mt-1"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <script>
        $(function() {
            let currentPage = 1;
            let pageSize = 10;
            let categories = []; // 存储所有产品类别
            
            // 初始化
            function init() {
                // 加载产品类别
                loadCategories();
                // 加载产品列表
                loadProductList();
            }
            
            // 加载产品类别
            function loadCategories() {
                get('/category/list').then(res => {
                    if (res.code === 200 && res.data) {
                        categories = res.data;
                        
                        // 渲染类别筛选下拉框
                        let filterHtml = '<option value="">所有类别</option>';
                        categories.forEach(category => {
                            filterHtml += `<option value="${category.categoryId}">${category.categoryName}</option>`;
                        });
                        $('#categoryFilter').html(filterHtml);
                        
                        // 渲染模态框中的类别下拉框
                        let modalHtml = '<option value="">请选择类别</option>';
                        categories.forEach(category => {
                            modalHtml += `<option value="${category.categoryId}">${category.categoryName}</option>`;
                        });
                        $('#categoryId').html(modalHtml);
                    }
                });
            }
            
            // 加载产品列表
            function loadProductList(page = 1) {
                currentPage = page;
                
                const searchText = $('#searchInput').val();
                const categoryId = $('#categoryFilter').val();
                
                get('/product/page', {
                    pageNum: page,
                    pageSize: pageSize,
                    productName: searchText,
                    productCode: searchText,
                    description: searchText,
                    categoryId: categoryId
                }).then(res => {
                    if (res.code === 200 && res.data) {
                        renderProductTable(res.data);
                        renderPagination(res.data);
                    }
                });
            }
            
            // 渲染产品表格
            function renderProductTable(pageInfo) {
                const productList = pageInfo.list || [];
                let html = '';
                
                if (productList.length === 0) {
                    html = '<tr><td colspan="9" class="text-center">暂无数据</td></tr>';
                } else {
                    productList.forEach(product => {
                        // 查找类别名称
                        const category = categories.find(c => c.categoryId == product.category) || {};
                        console.log(category);
                        
                        html += `
                            <tr>
                                <td>${product.productId}</td>
                                <td>${product.productNumber}</td>
                                <td>${product.productName}</td>
                                <td>${category.categoryName || '-'}</td>
                                <td>¥${product.price.toFixed(2)}</td>
                                <td>${product.stock}</td>

                                <td>${formatDate(product.createTime)}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary edit-btn" data-id="${product.productId}">
                                     编辑
                                    </button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${product.productId}">
                                        删除
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
                
                $('#productTableBody').html(html);
                
                // 绑定编辑按钮事件
                $('.edit-btn').click(function() {
                    const productId = $(this).data('id');
                    editProduct(productId);
                });
                
                // 绑定删除按钮事件
                $('.delete-btn').click(function() {
                    const productId = $(this).data('id');
                    deleteProduct(productId);
                });
            }
            
            // 渲染分页
            function renderPagination(pageInfo) {
                const totalPages = pageInfo.pages || 1;
                let html = '';
                
                // 上一页
                html += `
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage - 1}">上一页</a>
                    </li>
                `;
                
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    html += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a>
                        </li>
                    `;
                }
                
                // 下一页
                html += `
                    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage + 1}">下一页</a>
                    </li>
                `;
                
                $('#pagination').html(html);
                
                // 绑定页码点击事件
                $('.page-link').click(function() {
                    if (!$(this).parent().hasClass('disabled')) {
                        const page = $(this).data('page');
                        loadProductList(page);
                    }
                });
            }
            
            // 添加产品
            function addProduct() {
                // 重置表单
                $('#productForm')[0].reset();
                $('#productId').val('');
                
                // 修改模态框标题
                $('#productModalLabel').text('添加产品');
                
                // 显示模态框
                $('#productModal').modal('show');
            }
            

            function viewProduct(productId) {
            }
            
            // 编辑产品
            function editProduct(productId) {
                // 获取产品信息
                get(`/product/${productId}`).then(res => {
                    if (res.code === 200 && res.data) {
                        const product = res.data;
                        
                        // 填充表单
                        $('#productId').val(product.productId);
                        $('#productName').val(product.productName);
                        $('#productCode').val(product.productCode);
                        $('#categoryId').val(product.categoryId);
                        $('#price').val(product.price);
                        $('#stock').val(product.stock);
                        $('#status').val(product.status);
                        $('#description').val(product.description);
                        $('#specification').val(product.specification);
                        
                        // 修改模态框标题
                        $('#productModalLabel').text('编辑产品');
                        
                        // 显示模态框
                        $('#productModal').modal('show');
                    }
                });
            }
            
            // 保存产品
            function saveProduct() {
                const productId = $('#productId').val();
                const isEdit = !!productId;
                
                // 构建数据
                const productData = {
                    productName: $('#productName').val(),
                    productCode: $('#productCode').val(),
                    categoryId: $('#categoryId').val(),
                    price: $('#price').val(),
                    stock: $('#stock').val(),
                    status: $('#status').val(),
                    description: $('#description').val(),
                    specification: $('#specification').val()
                };
                
                if (isEdit) {
                    productData.productId = productId;
                    
                    // 更新
                    put('/product', productData).then(res => {
                        if (res.code === 200) {
                            // 关闭模态框
                            $('#productModal').modal('hide');
                            
                            // 重新加载列表
                            loadProductList(currentPage);
                            
                            // 显示成功消息

                        }
                    });
                } else {
                    // 新增
                    post('/product/add', productData).then(res => {
                        if (res.code === 200) {
                            // 关闭模态框
                            $('#productModal').modal('hide');
                            
                            // 重新加载列表
                            loadProductList(1);
                            
                            // 显示成功消息

                        }
                    });
                }
            }
            
            // 删除产品
            function deleteProduct(productId) {
                if (confirm('确定要删除该产品吗？')) {
                    del(`/product/${productId}`).then(res => {
                        if (res.code === 200) {
                            // 重新加载列表
                            loadProductList(currentPage);
                            
                            // 显示成功消息

                        }
                    });
                }
            }
            
            // 搜索按钮点击事件
            $('#searchBtn').click(function() {
                loadProductList(1);
            });
            
            // 回车键搜索
            $('#searchInput').keypress(function(e) {
                if (e.which === 13) {
                    loadProductList(1);
                }
            });
            
            // 类别筛选变化事件
            $('#categoryFilter').change(function() {
                loadProductList(1);
            });
            
            // 添加产品按钮点击事件
            $('#addProductBtn').click(function() {
                addProduct();
            });
            
            // 保存产品按钮点击事件
            $('#saveProductBtn').click(function() {
                if ($('#productForm')[0].checkValidity()) {
                    saveProduct();
                } else {
                    $('#productForm')[0].reportValidity();
                }
            });
            
            // 退出登录按钮事件
            $(document).on('click', '#logoutBtn', function() {
                logout();
            });
            
            // 初始化
            init();
        });
    </script>
</body>
</html>

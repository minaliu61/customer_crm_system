<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/crm/admin/index.html">客户信息管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown nav-admin">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-user"></i> <span id="currentUsername">管理员</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/crm/admin/profile.html">个人信息</a>
                        <a class="dropdown-item" href="/crm/admin/change-password.html">修改密码</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 左侧菜单 -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/index.html">
                                控制台
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/admin-list.html">
                                管理员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/salesperson-list.html">
                                销售人员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link active" href="/crm/admin/customer-list.html">
                                客户管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-category.html">
                                产品类别管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-list.html">
                                产品管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/order-list.html">
                                订单管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 右侧内容区域 -->
            <main role="main" class="col-md-10 ml-sm-auto main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">客户管理</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-sm btn-primary" id="addCustomerBtn">
                            <i class="fa fa-plus"></i> 添加客户
                        </button>
                    </div>
                </div>

                <!-- 搜索栏 -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="搜索用户名、姓名、电话或公司">
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary" type="button" id="searchBtn">
                                    <i class="fa fa-search"></i> 搜索
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 数据表格 -->
                <div class="table-responsive">
                    <table class="table table-striped table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>姓名</th>
                                <th>电话</th>
                                <th>邮箱</th>
                                <th>公司</th>
                                <th>行业</th>
                                <th>地区</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <!-- 数据将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-end" id="pagination">
                        <!-- 分页将通过JavaScript动态加载 -->
                    </ul>
                </nav>
            </main>
        </div>
    </div>

    <!-- 添加/编辑客户模态框 -->
    <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="customerModalLabel">添加客户</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="customerForm">
                        <input type="hidden" id="customerId">
                        <input type="hidden" id="userId">
                        
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" class="form-control" id="password">
                            <small class="form-text text-muted">编辑时留空表示不修改密码</small>
                        </div>
                        <div class="form-group">
                            <label for="realName">姓名</label>
                            <input type="text" class="form-control" id="realName" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">电话</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <div class="form-group">
                            <label for="email">邮箱</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="form-group">
                            <label for="company">公司名称</label>
                            <input type="text" class="form-control" id="company">
                        </div>
                        <div class="form-group">
                            <label for="industry">所属行业</label>
                            <input type="text" class="form-control" id="industry">
                        </div>
                        <div class="form-group">
                            <label for="address">地址</label>
                            <input type="text" class="form-control" id="address">
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="province">省份</label>
                                    <input type="text" class="form-control" id="province">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="city">城市</label>
                                    <input type="text" class="form-control" id="city">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="postalCode">邮政编码</label>
                            <input type="text" class="form-control" id="postalCode">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveCustomerBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <script>
        $(function() {
            let currentPage = 1;
            let pageSize = 10;
            
            // 加载客户列表
            function loadCustomerList(page = 1) {
                currentPage = page;
                
                const searchText = $('#searchInput').val();
                
                get('/customer/page', {
                    pageNum: page,
                    pageSize: pageSize,
                    username: searchText,
                    realName: searchText,
                    phone: searchText,
                    company: searchText
                }).then(res => {
                    if (res.code === 200 && res.data) {
                        renderCustomerTable(res.data);
                        renderPagination(res.data);
                    }
                });
            }
            
            // 渲染客户表格
            function renderCustomerTable(pageInfo) {
                const customerList = pageInfo.list || [];
                let html = '';
                
                if (customerList.length === 0) {
                    html = '<tr><td colspan="11" class="text-center">暂无数据</td></tr>';
                } else {
                    customerList.forEach(customer => {
                        html += `
                            <tr>
                                <td>${customer.userId}</td>
                                <td>${customer.user.username}</td>
                                <td>${customer.user.realName || '-'}</td>
                                <td>${customer.user.phone || '-'}</td>
                                <td>${customer.user.email || '-'}</td>
                                <td>${customer.company || '-'}</td>
                                <td>${customer.industry || '-'}</td>
                                <td>${(customer.province || '') + (customer.city || '') || '-'}</td>
                            </tr>
                        `;
                    });
                }
                
                $('#customerTableBody').html(html);
                

            }
            
            // 渲染分页
            function renderPagination(pageInfo) {
                const totalPages = pageInfo.pages || 1;
                let html = '';
                
                // 上一页
                html += `
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage - 1}">上一页</a>
                    </li>
                `;
                
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    html += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a>
                        </li>
                    `;
                }
                
                // 下一页
                html += `
                    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage + 1}">下一页</a>
                    </li>
                `;
                
                $('#pagination').html(html);
                
                // 绑定页码点击事件
                $('.page-link').click(function() {
                    if (!$(this).parent().hasClass('disabled')) {
                        const page = $(this).data('page');
                        loadCustomerList(page);
                    }
                });
            }
            
            // 添加客户
            function addCustomer() {
                // 重置表单
                $('#customerForm')[0].reset();
                $('#customerId').val('');
                $('#userId').val('');
                $('#password').attr('required', true);
                
                // 修改模态框标题
                $('#customerModalLabel').text('添加客户');
                
                // 显示模态框
                $('#customerModal').modal('show');
            }
            
            // 编辑客户
            function editCustomer(customerId) {
                // 获取客户信息
                get(`/customer/${customerId}`).then(res => {
                    if (res.code === 200 && res.data) {
                        const customer = res.data;
                        
                        // 填充表单
                        $('#customerId').val(customer.customerId);
                        $('#userId').val(customer.userId);
                        $('#username').val(customer.username);
                        $('#password').val('').attr('required', false);
                        $('#realName').val(customer.realName);
                        $('#phone').val(customer.phone);
                        $('#email').val(customer.email);
                        $('#company').val(customer.company);
                        $('#industry').val(customer.industry);
                        $('#address').val(customer.address);
                        $('#province').val(customer.province);
                        $('#city').val(customer.city);
                        $('#postalCode').val(customer.postalCode);
                        $('#status').val(customer.status);
                        
                        // 修改模态框标题
                        $('#customerModalLabel').text('编辑客户');
                        
                        // 显示模态框
                        $('#customerModal').modal('show');
                    }
                });
            }
            
            // 保存客户
            function saveCustomer() {
                const customerId = $('#customerId').val();
                const userId = $('#userId').val();
                const isEdit = !!customerId;
                
                // 构建用户数据
                const userData = {
                    username: $('#username').val(),
                    realName: $('#realName').val(),
                    phone: $('#phone').val(),
                    email: $('#email').val(),
                    status: $('#status').val()
                };
                
                // 构建客户数据
                const customerData = {
                    company: $('#company').val(),
                    industry: $('#industry').val(),
                    address: $('#address').val(),
                    city: $('#city').val(),
                    province: $('#province').val(),
                    postalCode: $('#postalCode').val()
                };
                
                // 如果是编辑模式
                if (isEdit) {
                    userData.userId = userId;
                    customerData.customerId = customerId;
                    customerData.userId = userId;
                    
                    // 如果输入了密码，则添加密码字段
                    if ($('#password').val()) {
                        userData.password = $('#password').val();
                    }
                    
                    // 保存用户数据
                    put('/user', userData).then(res => {
                        if (res.code === 200) {
                            // 保存客户数据
                            return put('/customer', customerData);
                        }
                    }).then(res => {
                        if (res.code === 200) {
                            // 关闭模态框
                            $('#customerModal').modal('hide');
                            
                            // 重新加载列表
                            loadCustomerList(currentPage);
                            
                            // 显示成功消息

                        }
                    });
                } else {
                    // 如果是添加模式
                    userData.password = $('#password').val();
                    userData.role = 3; // 客户角色
                    
                    // 保存用户数据
                    post('/user', userData).then(res => {
                        if (res.code === 200) {
                            const userId = res.data;
                            customerData.userId = userId;
                            
                            // 保存客户数据
                            return post('/customer', customerData);
                        }
                    }).then(res => {
                        if (res.code === 200) {
                            // 关闭模态框
                            $('#customerModal').modal('hide');
                            
                            // 重新加载列表
                            loadCustomerList(currentPage);
                            
                            // 显示成功消息

                        }
                    });
                }
            }
            
            // 删除客户
            function deleteCustomer(customerId, userId) {
                if (confirm('确定要删除该客户吗？')) {
                    del(`/customer/${customerId}`).then(res => {
                        if (res.code === 200) {
                            // 删除对应的用户
                            return del(`/user/${userId}`);
                        }
                    }).then(res => {
                        if (res.code === 200) {
                            // 重新加载列表
                            loadCustomerList(currentPage);
                            
                            // 显示成功消息

                        }
                    });
                }
            }
            
            // 搜索按钮点击事件
            $('#searchBtn').click(function() {
                loadCustomerList(1);
            });
            
            // 回车键搜索
            $('#searchInput').keypress(function(e) {
                if (e.which === 13) {
                    loadCustomerList(1);
                }
            });
            
            // 添加客户按钮点击事件
            $('#addCustomerBtn').click(function() {
                addCustomer();
            });
            
            // 保存客户按钮点击事件
            $('#saveCustomerBtn').click(function() {
                if ($('#customerForm')[0].checkValidity()) {
                    saveCustomer();
                } else {
                    $('#customerForm')[0].reportValidity();
                }
            });
            
            // 退出登录按钮事件
            $(document).on('click', '#logoutBtn', function() {
                logout();
            });
            
            // 初始化加载列表
            loadCustomerList();
        });
    </script>
</body>
</html>

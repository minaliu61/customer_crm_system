<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/crm/admin/index.html">客户信息管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-user"></i> <span id="currentUsername">管理员</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/crm/admin/profile.html">个人信息</a>
                        <a class="dropdown-item" href="/crm/admin/change-password.html">修改密码</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 左侧内容区域（原右侧内容区域） -->
            <main role="main" class="col-md-10 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">个人信息</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group mr-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshBtn">
                                <i class="fa fa-refresh"></i> 刷新
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 个人信息表单 -->
                <div class="row">
                    <div class="col-md-8">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">基本信息</h6>
                            </div>
                            <div class="card-body">
                                <form id="profileForm">
                                    <div class="form-group row">
                                        <label for="username" class="col-sm-2 col-form-label">用户名</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" id="username" readonly>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="realName" class="col-sm-2 col-form-label">真实姓名</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" id="realName" name="realName">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="phone" class="col-sm-2 col-form-label">手机号码</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" id="phone" name="phone">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="email" class="col-sm-2 col-form-label">电子邮箱</label>
                                        <div class="col-sm-10">
                                            <input type="email" class="form-control" id="email" name="email">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="position" class="col-sm-2 col-form-label">职位</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" id="position" name="position">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="department" class="col-sm-2 col-form-label">部门</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" id="department" name="department">
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <div class="col-sm-10 offset-sm-2">
                                            <button type="submit" class="btn btn-primary">保存修改</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- 右侧菜单 (原左侧菜单) -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/index.html">
                                控制台
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/admin-list.html">
                                <i class="fa fa-user-circle"></i> 管理员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/salesperson-list.html">
                                <i class="fa fa-user-circle-o"></i> 销售人员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/customer-list.html">
                                <i class="fa fa-users"></i> 客户管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-category.html">
                                <i class="fa fa-th-large"></i> 产品类别管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-list.html">
                                <i class="fa fa-cubes"></i> 产品管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/order-list.html">
                                <i class="fa fa-file-text-o"></i> 订单管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <script>
        $(function() {
            // 加载用户信息
            loadUserInfo();
            
            // 刷新按钮事件
            $('#refreshBtn').click(function() {
                loadUserInfo();
            });
            
            // 表单提交事件
            $('#profileForm').submit(function(e) {
                e.preventDefault();
                
                // 收集表单数据
                const formData = {
                    userId: window.userId,
                    realName: $('#realName').val(),
                    phone: $('#phone').val(),
                    email: $('#email').val(),
                    admin: {
                        position: $('#position').val(),
                        department: $('#department').val()
                    }
                };
                
                // 提交更新请求
                put('/admin/update', formData).then(res => {
                    if (res.code === 200) {
                        showMessage('个人信息更新成功');
                        loadUserInfo();
                    }
                });
            });
            
            // 加载用户信息
            function loadUserInfo() {
                get('/user/current').then(res => {
                    if (res.code === 200 && res.data) {
                        const user = res.data;
                        window.userId = user.userId;
                        
                        // 填充基本信息
                        $('#username').val(user.username);
                        $('#realName').val(user.realName);
                        $('#phone').val(user.phone);
                        $('#email').val(user.email);
                        
                        // 加载管理员详细信息
                        get('/admin/detail/' + user.userId).then(adminRes => {
                            if (adminRes.code === 200 && adminRes.data) {
                                const admin = adminRes.data;
                                $('#position').val(admin.position);
                                $('#department').val(admin.department);
                            }
                        });
                    }
                });
            }
            
            // 退出登录按钮事件
            $('#logoutBtn').click(function() {
                logout();
            });
        });
    </script>
</body>
</html>

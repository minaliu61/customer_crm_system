<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员控制台 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
    <style>
        .welcome-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 56px);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .welcome-text {
            font-size: 2.5rem;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/crm/admin/index.html">客户信息管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown nav-admin">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-user"></i> <span id="currentUsername">管理员</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/crm/admin/profile.html">个人信息</a>
                        <a class="dropdown-item" href="/crm/admin/change-password.html">修改密码</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 右侧菜单 (原左侧菜单) -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item nav-admin">
                            <a class="nav-link active" href="/crm/admin/index.html">
                                 控制台
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/admin-list.html">
                                 管理员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/salesperson-list.html">
                                销售人员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/customer-list.html">
                                 客户管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-category.html">
                                 产品类别管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-list.html">
                                产品管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/order-list.html">
                                订单管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <!-- 左侧内容区域（原右侧内容区域） -->
            <main role="main" class="col-md-10 ml-sm-auto px-4">
                <div class="welcome-container">
                    <h1 class="welcome-text">欢迎进入管理员界面</h1>
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <script>
        $(function() {
            // 加载管理员数量
            get('/admin/count').then(res => {
                if (res.code === 200) {
                    $('#adminCount').text(res.data);
                }
            });
            
            // 加载销售人员数量
            get('/salesperson/count').then(res => {
                if (res.code === 200) {
                    $('#salespersonCount').text(res.data);
                }
            });
            
            // 加载客户数量
            get('/customer/count').then(res => {
                if (res.code === 200) {
                    $('#customerCount').text(res.data);
                }
            });
            
            // 加载产品数量
            get('/product/count').then(res => {
                if (res.code === 200) {
                    $('#productCount').text(res.data);
                }
            });
            
            // 加载最近订单
            get('/order/recent', { limit: 10 }).then(res => {
                if (res.code === 200 && res.data) {
                    const orders = res.data;
                    let html = '';
                    
                    if (orders.length === 0) {
                        html = '<tr><td colspan="6" class="text-center">暂无订单数据</td></tr>';
                    } else {
                        orders.forEach(order => {
                            let statusText = '';
                            let statusClass = '';
                            
                            switch (order.orderStatus) {
                                case 0:
                                    statusText = '待付款';
                                    statusClass = 'badge-warning';
                                    break;
                                case 1:
                                    statusText = '已付款';
                                    statusClass = 'badge-info';
                                    break;
                                case 2:
                                    statusText = '已发货';
                                    statusClass = 'badge-primary';
                                    break;
                                case 3:
                                    statusText = '已完成';
                                    statusClass = 'badge-success';
                                    break;
                                case 4:
                                    statusText = '已取消';
                                    statusClass = 'badge-danger';
                                    break;
                            }
                            
                            html += `
                                <tr>
                                    <td>${order.orderNo}</td>
                                    <td>${order.customerName}</td>
                                    <td>${order.salespersonName}</td>
                                    <td>¥${order.totalAmount.toFixed(2)}</td>
                                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                                    <td>${formatDate(order.createTime)}</td>
                                </tr>
                            `;
                        });
                    }
                    
                    $('#recentOrdersTable tbody').html(html);
                }
            });
            
            // 刷新按钮事件
            $('#refreshBtn').click(function() {
                location.reload();
            });
            
            // 确保退出登录按钮事件正确绑定
            $(document).on('click', '#logoutBtn', function() {
                logout();
            });
        });
    </script>
</body>
</html>

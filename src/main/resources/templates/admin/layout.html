<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">默认标题 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
    <th:block th:replace="${styles}"></th:block>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/crm/admin/index.html">客户信息管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-user"></i> <span id="currentUsername">管理员</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/crm/admin/profile.html">个人信息</a>
                        <a class="dropdown-item" href="/crm/admin/change-password.html">修改密码</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 左侧内容区域 -->
            <main role="main" class="col-md-10 main-content">
                <th:block th:replace="${content}"></th:block>
            </main>

            <!-- 右侧菜单 -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item nav-admin">
                            <a class="nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}" href="/crm/admin/index.html">
                                <i class="fa fa-dashboard"></i> 控制台
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" th:classappend="${activeMenu == 'admin' ? 'active' : ''}" href="/crm/admin/admin-list.html">
                                <i class="fa fa-user-circle"></i> 管理员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" th:classappend="${activeMenu == 'salesperson' ? 'active' : ''}" href="/crm/admin/salesperson-list.html">
                                <i class="fa fa-user-circle-o"></i> 销售人员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" th:classappend="${activeMenu == 'customer' ? 'active' : ''}" href="/crm/admin/customer-list.html">
                                <i class="fa fa-users"></i> 客户管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" th:classappend="${activeMenu == 'category' ? 'active' : ''}" href="/crm/admin/product-category.html">
                                <i class="fa fa-th-large"></i> 产品类别管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" th:classappend="${activeMenu == 'product' ? 'active' : ''}" href="/crm/admin/product-list.html">
                                <i class="fa fa-cubes"></i> 产品管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" th:classappend="${activeMenu == 'order' ? 'active' : ''}" href="/crm/admin/order-list.html">
                                <i class="fa fa-file-text-o"></i> 订单管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <th:block th:replace="${scripts}"></th:block>
</body>
</html>

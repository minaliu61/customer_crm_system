<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品类别管理 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/crm/admin/index.html">客户信息管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown nav-admin">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-user"></i> <span id="currentUsername">管理员</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/crm/admin/profile.html">个人信息</a>
                        <a class="dropdown-item" href="/crm/admin/change-password.html">修改密码</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 左侧菜单 -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/index.html">
                                控制台
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/admin-list.html">
                                管理员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/salesperson-list.html">
                                销售人员管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/customer-list.html">
                                客户管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link active" href="/crm/admin/product-category.html">
                                产品类别管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/product-list.html">
                                产品管理
                            </a>
                        </li>
                        <li class="nav-item nav-admin">
                            <a class="nav-link" href="/crm/admin/order-list.html">
                                订单管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 右侧内容区域 -->
            <main role="main" class="col-md-10 ml-sm-auto main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">产品类别管理</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-sm btn-primary" id="addCategoryBtn">
                            <i class="fa fa-plus"></i> 添加类别
                        </button>
                    </div>
                </div>

                <!-- 数据表格 -->
                <div class="table-responsive">
                    <table class="table table-striped table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>类别名称</th>
                                <th>描述</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <!-- 数据将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-end" id="pagination">
                        <!-- 分页将通过JavaScript动态加载 -->
                    </ul>
                </nav>
            </main>
        </div>
    </div>

    <!-- 添加/编辑类别模态框 -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalLabel">添加产品类别</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="categoryId">
                        
                        <div class="form-group">
                            <label for="categoryName">类别名称</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="form-group">
                            <label for="description">描述</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveCategoryBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <script>
        $(function() {
            let currentPage = 1;
            let pageSize = 10;
            
            // 加载产品类别列表
            function loadCategoryList(page = 1) {
                currentPage = page;
                
                get('/category/page', {
                    pageNum: page,
                    pageSize: pageSize
                }).then(res => {
                    if (res.code === 200 && res.data) {
                        renderCategoryTable(res.data);
                        renderPagination(res.data);
                    }
                });
            }
            
            // 渲染产品类别表格
            function renderCategoryTable(pageInfo) {
                const categoryList = pageInfo.list || [];
                let html = '';
                
                if (categoryList.length === 0) {
                    html = '<tr><td colspan="6" class="text-center">暂无数据</td></tr>';
                } else {
                    categoryList.forEach(category => {
                        html += `
                            <tr>
                                <td>${category.categoryId}</td>
                                <td>${category.categoryName}</td>
                                <td>${category.description || '-'}</td>
                                <td>${formatDate(category.createTime)}</td>
                                <td>
                                    <button class="btn btn-sm btn-info edit-btn" data-id="${category.categoryId}">
                                        编辑
                                    </button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${category.categoryId}">
                                        删除
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
                
                $('#categoryTableBody').html(html);
                
                // 绑定编辑按钮事件
                $('.edit-btn').click(function() {
                    const categoryId = $(this).data('id');
                    editCategory(categoryId);
                });
                
                // 绑定删除按钮事件
                $('.delete-btn').click(function() {
                    const categoryId = $(this).data('id');
                    deleteCategory(categoryId);
                });
            }
            
            // 渲染分页
            function renderPagination(pageInfo) {
                const totalPages = pageInfo.pages || 1;
                let html = '';
                
                // 上一页
                html += `
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage - 1}">上一页</a>
                    </li>
                `;
                
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    html += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a>
                        </li>
                    `;
                }
                
                // 下一页
                html += `
                    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage + 1}">下一页</a>
                    </li>
                `;
                
                $('#pagination').html(html);
                
                // 绑定页码点击事件
                $('.page-link').click(function() {
                    if (!$(this).parent().hasClass('disabled')) {
                        const page = $(this).data('page');
                        loadCategoryList(page);
                    }
                });
            }
            
            // 添加产品类别
            function addCategory() {
                // 重置表单
                $('#categoryForm')[0].reset();
                $('#categoryId').val('');
                
                // 修改模态框标题
                $('#categoryModalLabel').text('添加产品类别');
                
                // 显示模态框
                $('#categoryModal').modal('show');
            }
            
            // 编辑产品类别
            function editCategory(categoryId) {
                // 获取产品类别信息
                get(`/category/${categoryId}`).then(res => {
                    if (res.code === 200 && res.data) {
                        const category = res.data;
                        
                        // 填充表单
                        $('#categoryId').val(category.categoryId);
                        $('#categoryName').val(category.categoryName);
                        $('#description').val(category.description);
                        $('#status').val(category.status);
                        
                        // 修改模态框标题
                        $('#categoryModalLabel').text('编辑产品类别');
                        
                        // 显示模态框
                        $('#categoryModal').modal('show');
                    }
                });
            }
            
            // 保存产品类别
            function saveCategory() {
                const categoryId = $('#categoryId').val();
                const isEdit = !!categoryId;
                
                // 构建数据
                const categoryData = {
                    categoryName: $('#categoryName').val(),
                    description: $('#description').val(),
                    status: $('#status').val()
                };
                
                if (isEdit) {
                    categoryData.categoryId = categoryId;
                    
                    // 更新
                    put('/category', categoryData).then(res => {
                        if (res.code === 200) {
                            // 关闭模态框
                            $('#categoryModal').modal('hide');
                            
                            // 重新加载列表
                            loadCategoryList(currentPage);
                            
                            // 显示成功消息

                        }
                    });
                } else {
                    // 新增
                    post('/category', categoryData).then(res => {
                        if (res.code === 200) {
                            // 关闭模态框
                            $('#categoryModal').modal('hide');
                            
                            // 重新加载列表
                            loadCategoryList(1);
                            
                            // 显示成功消息

                        }
                    });
                }
            }
            
            // 删除产品类别
            function deleteCategory(categoryId) {
                if (confirm('确定要删除该产品类别吗？')) {
                    del(`/category/${categoryId}`).then(res => {
                        if (res.code === 200) {
                            // 重新加载列表
                            loadCategoryList(currentPage);
                            
                            // 显示成功消息

                        }
                    });
                }
            }
            
            // 添加类别按钮点击事件
            $('#addCategoryBtn').click(function() {
                addCategory();
            });
            
            // 保存类别按钮点击事件
            $('#saveCategoryBtn').click(function() {
                if ($('#categoryForm')[0].checkValidity()) {
                    saveCategory();
                } else {
                    $('#categoryForm')[0].reportValidity();
                }
            });
            
            // 退出登录按钮事件
            $(document).on('click', '#logoutBtn', function() {
                logout();
            });
            
            // 初始化加载列表
            loadCategoryList();
        });
    </script>
</body>
</html>

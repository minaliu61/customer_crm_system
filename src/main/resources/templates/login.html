<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <h2>客户信息管理系统</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="role">登录角色</label>
                    <select class="form-control" id="role" name="role">
                        <option value="1">管理员</option>
                        <option value="2">销售人员</option>
                        <option value="3">客户</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">登录</button>
                </div>
                <div class="text-center">
                    <a href="/crm/register.html">没有账号？立即注册</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <script>
        $(function() {
            // 登录表单提交
            $('#loginForm').submit(function(e) {
                e.preventDefault();
                
                const username = $('#username').val();
                const password = $('#password').val();
                const role = $('#role').val();
                
                if (!username || !password) {

                    return;
                }
                
                // 发送登录请求
                post('/user/login', { username, password }).then(res => {
                    if (res.code === 200 && res.data) {
                        const user = res.data;
                        
                        // 验证角色是否匹配
                        if (user.role !== parseInt(role)) {

                            return;
                        }
                        

                        // 根据角色跳转到不同页面
                        setTimeout(() => {
                            if (user.role === 1) {
                                // 管理员
                                window.location.href = '/crm/admin/index.html';
                            } else if (user.role === 2) {
                                // 销售人员
                                window.location.href = '/crm/sales';
                            } else if (user.role === 3) {
                                // 客户
                                window.location.href = '/crm/customer/order-list.html';
                            }
                        }, 1500);
                    }
                });
            });
        });
    </script>
</body>
</html>

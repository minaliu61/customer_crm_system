<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
</head>
<body>
<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="/crm/customer/index.html">客户信息管理系统</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item dropdown nav-customer">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                    <i class="fa fa-user"></i> <span id="currentUsername">客户</span>
                </a>
                <div class="dropdown-menu dropdown-menu-right">
                    <a class="dropdown-item" href="/crm/customer/profile.html">个人信息</a>
                    <a class="dropdown-item" href="/crm/customer/change-password.html">修改密码</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                </div>
            </li>
        </ul>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- 左侧菜单 -->
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="sidebar-sticky">
                <ul class="nav flex-column">
                    <li class="nav-item nav-customer">
                        <a class="nav-link" href="/crm/customer/profile.html">
                            个人信息
                        </a>
                    </li>
                    <li class="nav-item nav-customer">
                        <a class="nav-link active" href="/crm/customer/order-list.html">
                            我的订单
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- 右侧内容区域 -->
        <main role="main" class="col-md-10 ml-sm-auto main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">我的订单</h1>
            </div>

            <!-- 订单列表 -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="orderTable" width="100%" cellspacing="0">
                            <thead>
                            <tr>
                                <th>订单编号</th>
                                <th>订单金额</th>
                                <th>下单时间</th>
                                <th>销售人员</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- 这里将通过JavaScript动态加载数据 -->
                            </tbody>
                        </table>
                    </div>
                    <!-- 分页 -->
                    <nav aria-label="Page navigation" class="mt-4">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- 分页将通过JavaScript动态生成 -->
                        </ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- 订单详情模态框 -->
<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="orderDetailModalLabel">订单详情</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <p><strong>订单编号:</strong> <span id="detailOrderNo"></span></p>
                        <p><strong>下单时间:</strong> <span id="detailCreateTime"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>客户名称:</strong> <span id="detailCustomerName"></span></p>
                        <p><strong>联系电话:</strong> <span id="detailPhone"></span></p>
                        <p><strong>销售人员:</strong> <span id="detailSalesperson"></span></p>
                    </div>
                </div>



                <hr>

                <h5>订单备注</h5>
                <p id="detailRemark" class="p-3 bg-light rounded">暂无备注</p>

                <hr>

                <h5>订单操作日志</h5>
                <ul class="list-group" id="orderLogList">
                    <!-- 订单日志将通过JavaScript动态加载 -->
                </ul>
            </div>
            <div class="modal-footer" id="orderDetailFooter">
                <!-- 订单操作按钮将根据订单状态动态加载 -->
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
<script src="/crm/js/common.js"></script>
<script>
    $(function() {
        let currentPage = 1;
        let pageSize = 10;
        let customerId = null;

        // 获取当前客户ID
        function getCurrentCustomerId() {
            return new Promise((resolve, reject) => {
                get('/user/current').then(res => {
                    if (res.code === 200 && res.data) {
                        const userId = res.data.userId;

                        get('/customer/by-user-id', { userId: userId }).then(customerRes => {
                            if (customerRes.code === 200 && customerRes.data) {
                                resolve(customerRes.data.customerId);
                            } else {
                                reject('获取客户信息失败');
                            }
                        }).catch(err => reject(err));
                    } else {
                        reject('获取用户信息失败');
                    }
                }).catch(err => reject(err));
            });
        }

        // 加载订单列表
        function loadOrderList() {
            if (!customerId) {
                getCurrentCustomerId().then(id => {
                    customerId = id;
                    doLoadOrderList();
                }).catch(err => {

                });
            } else {
                doLoadOrderList();
            }
        }

        // 执行加载订单列表
        function doLoadOrderList() {
            const params = {
                customerId: customerId,
                pageNum: currentPage,
                pageSize: pageSize
            };

            // 添加筛选条件
            const orderNo = $('#orderNo').val();
            const orderStatus = $('#orderStatus').val();

            if (orderNo) params.orderNo = orderNo;
            if (orderStatus) params.orderStatus = orderStatus;

            get('/order/page-by-customer', params).then(res => {
                if (res.code === 200 && res.data) {
                    const orders = res.data.list;
                    const total = res.data.total;
                    const pages = res.data.pages;

                    renderOrderList(orders);
                    renderPagination(pages, total);
                }
            });
        }

        // 渲染订单列表
        function renderOrderList(orders) {
            let html = '';

            orders.forEach(order => {
                let statusText = '';
                let statusClass = '';


                html += `
                        <tr>
                            <td>${order.orderId}</td>
                            <td>¥${order.totalAmount.toFixed(2)}</td>
                            <td>${formatDate(order.createTime)}</td>
                            <td>${order.salesperson.name || order.salesperson.employeeId || '-'}</td>
                            <td>

                                ${order.status === 0 ? `


                                ` : ''}
                                ${order.status === 3 ? `

                                ` : ''}
                            </td>
                        </tr>
                    `;
            });

            if (orders.length === 0) {
                html = '<tr><td colspan="6" class="text-center">暂无订单数据</td></tr>';
            }

            $('#orderTable tbody').html(html);


            // 取消按钮点击事件
            $('.cancel-btn').click(function() {
                const orderId = $(this).data('id');
                if (confirm('确定要取消此订单吗？')) {
                    put('/order/cancel', { orderId: orderId }).then(res => {
                        if (res.code === 200) {

                            loadOrderList();
                        }
                    });
                }
            });

        }

        // 渲染订单详情
        function renderOrderDetail(order) {
            // 填充订单基本信息
            $('#detailOrderNo').text(order.orderId);
            $('#detailCreateTime').text(formatDate(order.createTime));
            $('#detailCustomerName').text(order.customer.user.realName || order.customer.customerName || '-');
            $('#detailPhone').text(order.customer.user.phone || '-');
            $('#detailSalesperson').text(order.salesperson.name || order.salesperson.employeeId || '-');

            // 设置订单状态文本和样式
            let statusText = '';
            let statusClass = '';



            $('#detailOrderStatus').text(statusText).addClass(statusClass);

            // 填充列表
            let itemsHtml = '';
            if (order.orderItems && order.orderItems.length > 0) {
                order.orderItems.forEach(item => {
                    itemsHtml += `
                <tr>
                    <td>${item.productName || '-'}</td>
                    <td>¥${item.price.toFixed(2)}</td>
                    <td>${item.quantity}</td>
                    <td>¥${(item.price * item.quantity).toFixed(2)}</td>
                </tr>
            `;
                });
            } else {
                itemsHtml = '<tr><td colspan="4" class="text-center">无商品信息</td></tr>';
            }

            $('#orderItemsBody').html(itemsHtml);
            $('#detailTotalAmount').text(order.totalAmount.toFixed(2));

            // 填充订单备注
            if (order.remark) {
                $('#detailRemark').text(order.remark);
            } else {
                $('#detailRemark').text('暂无备注');
            }

            // 填充订单日志
            let logsHtml = '';
            if (order.logs && order.logs.length > 0) {
                order.logs.forEach(log => {
                    logsHtml += `
                <li class="list-group-item">
                    <div class="d-flex justify-content-between">
                        <span>${log.operationName}</span>
                        <small class="text-muted">${formatDate(log.createTime)}</small>
                    </div>
                    <p class="mb-0">${log.operationDesc || '-'}</p>
                </li>
            `;
                });
            } else {
                logsHtml = '<li class="list-group-item text-muted">暂无操作日志</li>';
            }

            $('#orderLogList').html(logsHtml);

            // 根据订单状态动态显示操作按钮
            updateOrderDetailFooter(order);
        }

        // 根据订单状态更新模态框底部的操作按钮
        function updateOrderDetailFooter(order) {
            const footer = $('#orderDetailFooter');
            footer.empty(); // 清空现有按钮

            // 关闭按钮始终存在
            footer.append(`
        <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
    `);


        }


        // 渲染分页
        function renderPagination(pages, total) {
            let html = '';

            // 上一页
            html += `
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage - 1}">上一页</a>
                    </li>
                `;

            // 页码
            for (let i = 1; i <= pages; i++) {
                if (i === currentPage) {
                    html += `<li class="page-item active"><a class="page-link" href="javascript:void(0);">${i}</a></li>`;
                } else if (i === 1 || i === pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<li class="page-item"><a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a></li>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<li class="page-item disabled"><a class="page-link" href="javascript:void(0);">...</a></li>`;
                }
            }

            // 下一页
            html += `
                    <li class="page-item ${currentPage === pages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage + 1}">下一页</a>
                    </li>
                `;

            $('#pagination').html(html);

            // 页码点击事件
            $('#pagination .page-link').click(function() {
                if (!$(this).parent().hasClass('disabled') && !$(this).parent().hasClass('active')) {
                    const page = $(this).data('page');
                    if (page) {
                        currentPage = page;
                        loadOrderList();
                    }
                }
            });
        }

        // 表单提交事件
        $('#searchForm').submit(function(e) {
            e.preventDefault();
            currentPage = 1;
            loadOrderList();
        });

        // 表单重置事件
        $('#searchForm button[type="reset"]').click(function() {
            setTimeout(function() {
                currentPage = 1;
                loadOrderList();
            }, 0);
        });

        // 进入页面立即加载订单列表
        loadOrderList();

        // 刷新按钮事件
        $('#refreshBtn').click(function() {
            loadOrderList();

        });

        // 退出登录按钮事件
        $(document).on('click', '#logoutBtn', function() {
            logout();
        });
    });
</script>
</body>
</html>

    <script>
        $(function() {
            // 加载用户信息
            loadUserInfo();
            
            // 刷新按钮事件
            $('#refreshBtn').click(function() {
                loadUserInfo();
            });
            
            // 表单提交事件
            $('#profileForm').submit(function(e) {
                e.preventDefault();
                
                // 收集表单数据
                const formData = {
                    userId: window.userId,
                    realName: $('#realName').val(),
                    phone: $('#phone').val(),
                    email: $('#email').val(),
                    customer: {
                        company: $('#company').val(),
                        industry: $('#industry').val(),
                        address: $('#address').val(),
                        city: $('#city').val(),
                        province: $('#province').val(),
                        postalCode: $('#postalCode').val()
                    }
                };
                
                // 提交更新请求
                put('/customer/update', formData).then(res => {
                    if (res.code === 200) {

                        loadUserInfo();
                    }
                });
            });
            
            // 加载用户信息
            function loadUserInfo() {
                get('/user/current').then(res => {
                    if (res.code === 200 && res.data) {
                        const user = res.data;
                        window.userId = user.userId;
                        
                        // 填充基本信息
                        $('#username').val(user.username);
                        $('#realName').val(user.realName);
                        $('#phone').val(user.phone);
                        $('#email').val(user.email);
                        
                        // 加载客户详细信息
                        get('/customer/' + user.userId).then(customerRes => {
                            if (customerRes.code === 200 && customerRes.data) {
                                const customer = customerRes.data;
                                $('#company').val(customer.company);
                                $('#industry').val(customer.industry);
                                $('#address').val(customer.address);
                                $('#city').val(customer.city);
                                $('#province').val(customer.province);
                                $('#postalCode').val(customer.postalCode);
                            }
                        });
                    }
                });
            }

            // 退出登录按钮事件
            $(document).on('click', '#logoutBtn', function() {
                logout();
            });
        });

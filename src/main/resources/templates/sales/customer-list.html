    <script>
        $(function() {
            let currentPage = 1;
            let pageSize = 10;
            let currentCustomerId = null;
            
            // 加载客户列表
            function loadCustomerList(page = 1) {
                currentPage = page;
                
                // 获取搜索条件
                const searchText = $('#searchText').val();
                const searchIndustry = $('#searchIndustry').val();
                
                get('/customer/list', {
                    pageNum: page,
                    pageSize: pageSize,
                    searchText: searchText,
                    industry: searchIndustry
                }).then(res => {
                    if (res.code === 200 && res.data) {
                        renderCustomerTable(res.data);
                        renderPagination(res.data);
                    }
                });
            }
            
            // 渲染客户表格
            function renderCustomerTable(pageInfo) {
                console.log("pageInfo=====",pageInfo);

                const customerList = pageInfo || [];
                let html = '';
                
                if (customerList.length === 0) {
                    html = '<tr><td colspan="8" class="text-center">暂无客户数据</td></tr>';
                } else {
                    customerList.forEach(customer => {
                        const region = [customer.province || '', customer.city || ''].filter(item => item).join(' ');
                        
                        html += `
                            <tr>
                                <td>${customer.customerId}</td>
                                <td>${customer.company || '-'}</td>
                                <td>${customer.industry || '-'}</td>
                                <td>${customer.user.realName || '-'}</td>
                                <td>${customer.user.phone || '-'}</td>
                                <td>${customer.user.email || '-'}</td>
                                <td>${region || '-'}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary edit-btn" data-id="${customer.customerId}">
                                     编辑
                                    </button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${customer.customerId}">
                                        删除
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
                
                $('#customerTableBody').html(html);

                // 绑定编辑按钮事件
                $('.edit-btn').click(function() {
                    const customerId = $(this).data('id');
                    editCustomer(customerId);
                });
                
                // 绑定删除按钮事件
                $('.delete-btn').click(function() {
                    const customerId = $(this).data('id');
                    deleteCustomer(customerId);
                });
            }
            
            // 渲染分页
            function renderPagination(pageInfo) {
                const totalPages = pageInfo.pages || 1;
                let html = '';
                
                // 上一页
                html += `
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage - 1}">上一页</a>
                    </li>
                `;
                
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    html += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a>
                        </li>
                    `;
                }
                
                // 下一页
                html += `
                    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${currentPage + 1}">下一页</a>
                    </li>
                `;
                
                $('#pagination').html(html);
                
                // 绑定页码点击事件
                $('.page-link').click(function() {
                    if (!$(this).parent().hasClass('disabled')) {
                        const page = $(this).data('page');
                        loadCustomerList(page);
                    }
                });
            }
            
            // 查看客户详情
            function viewCustomerDetail(customerId) {
            }
            
            // 添加客户
            function addCustomer() {
                // 重置表单
                $('#customerForm')[0].reset();
                $('#customerId').val('');
                
                // 修改模态框标题
                $('#customerModalLabel').text('添加客户');
                
                // 显示模态框
                $('#customerModal').modal('show');
            }
            
            // 编辑客户
            function editCustomer(customerId) {
                // 获取客户详情
                get(`/customer/${customerId}`).then(res => {
                    if (res.code === 200 && res.data) {
                        const customer = res.data;
                        
                        // 填充表单
                        $('#customerId').val(customer.customerId);
                        $('#customerName').val(customer.user.realName);
                        $('#company').val(customer.company);
                        $('#phone').val(customer.user.phone);
                        $('#email').val(customer.user.email);
                        $('#industry').val(customer.industry);
                        $('#address').val(customer.address);
                        $('#province').val(customer.province);
                        $('#city').val(customer.city);
                        $('#postalCode').val(customer.postalCode);
                        
                        // 修改模态框标题
                        $('#customerModalLabel').text('编辑客户');
                        
                        // 显示模态框
                        $('#customerModal').modal('show');
                    }
                });
            }
            
            // 保存客户
            function saveCustomer() {
                const customerId = $('#customerId').val();
                const isEdit = !!customerId;
                
                // 构建数据
                const customerData = {
                    user: {
                        realName: $('#customerName').val(),
                        phone: $('#phone').val(),
                        email: $('#email').val()
                    },
                    company: $('#company').val(),
                    industry: $('#industry').val(),
                    address: $('#address').val(),
                    province: $('#province').val(),
                    city: $('#city').val(),
                    postalCode: $('#postalCode').val()
                };
                
                if (isEdit) {
                    customerData.customerId = customerId;
                    
                    // 更新
                    put('/customer', customerData).then(res => {
                        if (res.code === 200) {
                            // 关闭模态框
                            $('#customerModal').modal('hide');
                            
                            // 重新加载列表
                            loadCustomerList(currentPage);
                            
                            // 显示成功消息

                            // 重新加载列表
                            loadCustomerList(1);
                            
                            // 显示成功消息

                        }
                    });
                }

                //                 var selectBtn = $('<button class="btn btn-sm btn-success">选择</button>');
                //
                //                 // 绑定选择按钮点击事件
                //                 selectBtn.click(function() {

            // 保存客户按钮点击事件
            $('#saveCustomerBtn').click(function() {
                if ($('#customerForm')[0].checkValidity()) {
                    saveCustomer();

                    $('#customerForm')[0].reportValidity();

            $(document).on('click', '#logoutBtn', function() {

            // 搜索客户相关变量和函数
            let searchCurrentPage = 1;
            let searchPageSize = 10;

            // 加载所有客户列表
            function loadAllCustomers(page = 1) {
                searchCurrentPage = page;
                
                get('/customer/list', {
                    pageNum: page,
                    pageSize: searchPageSize
                }).then(res => {
                    console.log('API返回数据:', res); // 添加日志查看API返回数据
                    
                    if (res.code === 200) {
                        // 检查数据结构
                        if (res.data && Array.isArray(res.data)) {
                            // 如果返回的是数组，直接使用
                            const pageData = {
                                list: res.data,
                                pages: Math.ceil(res.data.length / searchPageSize) || 1
                            };
                            renderAllCustomersTable(pageData);
                            renderAllCustomersPagination(pageData);
                        } else if (res.data) {
                            // 如果返回的是分页对象
                            renderAllCustomersTable(res.data);
                            renderAllCustomersPagination(res.data);
                        } else {
                            // 没有数据的情况
                            renderAllCustomersTable({ list: [] });
                            renderAllCustomersPagination({ pages: 1 });
                        }
                    } else {

                    }
                }).catch(err => {
                    console.error('获取客户列表出错:', err);

                });
            }
            
            // 渲染所有客户表格
            function renderAllCustomersTable(pageInfo) {
                const customerList = pageInfo.list || [];
                let html = '';
                
                if (customerList.length === 0) {
                    html = '<tr><td colspan="7" class="text-center">暂无客户数据</td></tr>';
                } else {
                    customerList.forEach(customer => {
                        console.log('客户数据:', customer); // 添加日志查看数据结构
                        
                        // 确保数据结构正确，如果user不存在则使用空对象
                        const user = customer.user || {};
                        const region = [customer.province || '', customer.city || ''].filter(item => item).join(' ');
                        
                        html += `
                            <tr>
                                <td>${customer.customerId || '-'}</td>
                                <td>${customer.company || '-'}</td>
                                <td>${customer.industry || '-'}</td>
                                <td>${user.realName || customer.realName || '-'}</td>
                                <td>${user.phone || customer.phone || '-'}</td>
                                <td>${region || '-'}</td>
                                <td>
                                    <button class="btn btn-sm btn-success select-customer-btn" data-id="${customer.customerId}">
                                        选择
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
                
                $('#searchCustomerTableBody').html(html);
                
                // 绑定选择客户按钮事件
                $('.select-customer-btn').click(function() {
                    const customerId = $(this).data('id');
                    selectCustomer(customerId);
                });
            }
            
            // 渲染所有客户分页
            function renderAllCustomersPagination(pageInfo) {
                const totalPages = pageInfo.pages || 1;
                let html = '';
                
                // 上一页
                html += `
                    <li class="page-item ${searchCurrentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${searchCurrentPage - 1}">上一页</a>
                    </li>
                `;
                
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    html += `
                        <li class="page-item ${i === searchCurrentPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a>
                        </li>
                    `;
                }
                
                // 下一页
                html += `
                    <li class="page-item ${searchCurrentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${searchCurrentPage + 1}">下一页</a>
                    </li>
                `;
                
                $('#searchPagination').html(html);
                
                // 绑定页码点击事件
                $('#searchPagination .page-link').click(function() {
                    if (!$(this).parent().hasClass('disabled')) {
                        const page = $(this).data('page');
                        loadAllCustomers(page);
                    }
                });
            }
            
            // 选择客户
            function selectCustomer(customerId) {
                // 获取客户详情
                get(`/customer/${customerId}`).then(res => {
                    if (res.code === 200 && res.data) {
                        // 关闭搜索模态框
                        $('#customerSearchModal').modal('hide');
                        
                        // 打开客户详情模态框
                        viewCustomerDetail(customerId);
                    }
                });
            }

            // 模态框中的新建客户按钮点击事件
            $('#createNewCustomerBtn').click(function() {
                // 关闭搜索模态框
                $('#customerSearchModal').modal('hide');
                
                // 打开添加客户模态框
                $('#customerForm')[0].reset();
                $('#customerId').val('');
                $('#customerModalLabel').text('添加客户');
                $('#customerModal').modal('show');
            });
        });
    </script>
</body>
</html>

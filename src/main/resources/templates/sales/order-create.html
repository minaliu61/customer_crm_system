<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建订单 - 客户信息管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
    <link rel="stylesheet" href="/crm/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/crm/sales/index.html">客户信息管理系统</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown nav-sales">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                        <i class="fa fa-user"></i> <span id="currentUsername">销售人员</span>
                        <span id="salespersonId" style="display: none">销售人员</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="/crm/sales/profile.html">个人信息</a>
                        <a class="dropdown-item" href="/crm/sales/change-password.html">修改密码</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" id="logoutBtn">退出登录</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 左侧菜单 -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
<!--                        <li class="nav-item nav-sales">-->
<!--                            <a class="nav-link" href="/crm/sales/index.html">-->
<!--                                <i class="fa fa-dashboard"></i> 控制台-->
<!--                            </a>-->
<!--                        </li>-->
                        <li class="nav-item nav-sales">
                            <a class="nav-link" href="/crm/sales/profile.html">
                                <i class="fa fa-user"></i> 个人信息
                            </a>
                        </li>
                        <li class="nav-item nav-sales">
                            <a class="nav-link" href="/crm/sales/customer-list.html">
                                <i class="fa fa-users"></i> 客户管理
                            </a>
                        </li>
                        <li class="nav-item nav-sales">
                            <a class="nav-link" href="/crm/sales/order-list.html">
                                <i class="fa fa-file-text-o"></i> 订单管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 右侧内容区域 -->
            <main role="main" class="col-md-10 ml-sm-auto main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">创建订单</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="/crm/sales/order-list.html" class="btn btn-sm btn-outline-secondary">
                            <i class="fa fa-arrow-left"></i> 返回订单列表
                        </a>
                    </div>
                </div>

                <!-- 订单表单 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">客户信息</h5>
                    </div>
                    <div class="card-body">
                        <form id="orderForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="customerId">选择客户</label>
                                        <select class="form-control" id="customerId" required>
                                            <option value="">-- 请选择客户 --</option>
                                            <!-- 客户选项将通过JavaScript动态加载 -->
                                        </select>
                                    </div>

                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="customerPhone">联系电话</label>
                                        <input type="text" class="form-control" id="customerPhone" readonly>

                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label for="address">收货地址</label>
                                        <textarea class="form-control" id="address" rows="2" required></textarea>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">产品信息</h5>
                        <button class="btn btn-primary btn-sm" id="addProductBtn">
                            <i class="fa fa-plus"></i> 添加产品
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="productTable">
                                <thead>
                                    <tr>
                                        <th style="width: 5%">#</th>
                                        <th style="width: 35%">产品名称</th>
                                        <th style="width: 15%">单价</th>
                                        <th style="width: 15%">数量</th>
                                        <th style="width: 15%">小计</th>
                                        <th style="width: 15%">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- 产品行将通过JavaScript动态加载 -->
                                    <tr id="noProductRow">
                                        <td colspan="6" class="text-center">请添加产品</td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <td colspan="4" class="text-right"><strong>合计:</strong></td>
                                        <td><strong>¥<span id="totalAmount">0.00</span></strong></td>
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">订单备注</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="form-group">
                                <textarea class="form-control" id="remark" rows="3" placeholder="请输入订单备注信息"></textarea>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="text-center mb-4">
                    <button type="button" class="btn btn-primary btn-lg" id="submitOrderBtn">提交订单</button>
                    <button type="button" class="btn btn-secondary btn-lg ml-2" id="saveOrderBtn">保存草稿</button>
                    <button type="button" class="btn btn-light btn-lg ml-2" id="cancelBtn">取消</button>
                </div>
            </main>
        </div>
    </div>

    <!-- 添加产品模态框 -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">选择产品</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row mb-3">
                        <div class="col">
                            <input type="text" class="form-control" id="searchProductText" placeholder="搜索产品名称/编号">
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-primary" id="searchProductBtn">
                                <i class="fa fa-search"></i> 搜索
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover" id="productSearchTable">
                            <thead>
                                <tr>
                                    <th>产品图片</th>
                                    <th>产品名称</th>
                                    <th>产品编号</th>
                                    <th>类别</th>
                                    <th>价格</th>
                                    <th>库存</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- 产品搜索结果将通过JavaScript动态加载 -->
                            </tbody>
                        </table>
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-end" id="productPagination">
                            <!-- 分页将通过JavaScript动态加载 -->
                        </ul>
                    </nav>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>
    <script src="/crm/js/common.js"></script>
    <script>
        $(function() {
            let selectedProducts = [];
            let productSearchPage = 1;
            let productSearchPageSize = 5;
            
            // 检查URL参数是否有客户ID
            const urlParams = new URLSearchParams(window.location.search);
            const preselectedCustomerId = urlParams.get('customerId');
            let currentUserId = null;
            // 初始化
            loadCustomers();
            
            // 如果有预选客户，加载其信息
            if (preselectedCustomerId) {
                loadCustomerDetails(preselectedCustomerId);
            }
            
            // 检查localStorage中是否有已选择的产品
            const storedProducts = localStorage.getItem('selectedProducts');
            if (storedProducts) {
                selectedProducts = JSON.parse(storedProducts);
                renderSelectedProducts();
            }
            
            // 加载客户列表
            function loadCustomers() {
                get('/customer/my').then(res => {
                    if (res.code === 200 && res.data) {
                        let html = '<option value="">--请选择客户--</option>';
                        
                        res.data.list.forEach(customer => {
                            html += `<option value="${customer.customerId}" data-phone="${customer.user.phone || ''}" data-address="${customer.address || ''}">${customer.user.realName}</option>`;
                        });
                        
                        $('#customerId').html(html);
                    }
                });
            }
            
            // 加载客户详情
            function loadCustomerDetails(customerId) {
                get(`/customer/${customerId}`).then(res => {
                    if (res.code === 200 && res.data) {
                        const customer = res.data;
                        
                        $('#customerPhone').val(customer.user.phone || '');
                        
                        // 构建完整地址
                        let fullAddress = '';
                        if (customer.province) fullAddress += customer.province + ' ';
                        if (customer.city) fullAddress += customer.city + ' ';
                        if (customer.address) fullAddress += customer.address;
                        
                        $('#address').val(fullAddress || '');
                    }
                });
            }
            
            // 搜索产品
            function searchProducts(page = 1) {
                productSearchPage = page;
                
                const searchText = $('#searchProductText').val();
                
                get('/product/page', {
                    pageNum: page,
                    pageSize: productSearchPageSize,
                    searchText: searchText
                }).then(res => {
                    if (res.code === 200 && res.data) {
                        renderProductSearchResults(res.data);
                        renderProductPagination(res.data);
                    }
                });
            }
            
            // 渲染产品搜索结果
            function renderProductSearchResults(pageInfo) {
                const products = pageInfo.list || [];
                let html = '';
                
                if (products.length === 0) {
                    html = '<tr><td colspan="7" class="text-center">未找到符合条件的产品</td></tr>';
                } else {
                    products.forEach(product => {
                        const image = product.image || '/crm/images/product-placeholder.png';
                        const isOutOfStock = product.stock <= 0;
                        
                        html += `
                            <tr>
                                <td><img src="${image}" alt="${product.productName}" style="height: 50px;"></td>
                                <td>${product.productName}</td>
                                <td>${product.productNo || '-'}</td>
                                <td>${product.categoryName || '未分类'}</td>
                                <td>¥${product.price.toFixed(2)}</td>
                                <td>${product.stock}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary select-product-btn" 
                                            data-id="${product.productId}"
                                            data-name="${product.productName}"
                                            data-price="${product.price}"
                                            data-stock="${product.stock}"
                                            data-image="${image}"
                                            ${isOutOfStock ? 'disabled' : ''}>
                                        ${isOutOfStock ? '无库存' : '添加'}
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
                
                $('#productSearchTable tbody').html(html);
                
                // 绑定选择产品按钮事件
                $('.select-product-btn').click(function() {
                    const productId = $(this).data('id');
                    const productName = $(this).data('name');
                    const price = $(this).data('price');
                    const stock = $(this).data('stock');
                    const image = $(this).data('image');
                    
                    // 检查产品是否已存在于选择列表中
                    const existingIndex = selectedProducts.findIndex(p => p.productId == productId);
                    
                    if (existingIndex >= 0) {
                        // 已存在，增加数量
                        selectedProducts[existingIndex].quantity += 1;
                    } else {
                        // 不存在，添加新产品
                        selectedProducts.push({
                            productId,
                            productName,
                            price,
                            stock,
                            image,
                            quantity: 1
                        });
                    }
                    
                    // 渲染已选产品
                    renderSelectedProducts();
                    
                    // 保存到localStorage
                    localStorage.setItem('selectedProducts', JSON.stringify(selectedProducts));
                    
                    // 显示提示
                    showMessage(`已添加: ${productName}`);
                });
            }
            
            // 渲染产品分页
            function renderProductPagination(pageInfo) {
                const totalPages = pageInfo.pages || 1;
                let html = '';
                
                // 上一页
                html += `
                    <li class="page-item ${productSearchPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${productSearchPage - 1}">上一页</a>
                    </li>
                `;
                
                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    html += `
                        <li class="page-item ${i === productSearchPage ? 'active' : ''}">
                            <a class="page-link" href="javascript:void(0);" data-page="${i}">${i}</a>
                        </li>
                    `;
                }
                
                // 下一页
                html += `
                    <li class="page-item ${productSearchPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="javascript:void(0);" data-page="${productSearchPage + 1}">下一页</a>
                    </li>
                `;
                
                $('#productPagination').html(html);
                
                // 绑定页码点击事件
                $('#productPagination .page-link').click(function() {
                    if (!$(this).parent().hasClass('disabled')) {
                        const page = $(this).data('page');
                        searchProducts(page);
                    }
                });
            }
            
            // 渲染已选择的产品
            function renderSelectedProducts() {
                if (selectedProducts.length === 0) {
                    // 显示空行
                    $('#noProductRow').show();
                    $('#totalAmount').text('0.00');
                    return;
                }
                
                // 隐藏空行
                $('#noProductRow').hide();
                
                // 清空现有行
                $('#productTable tbody tr:not(#noProductRow)').remove();
                
                // 计算总价
                let totalAmount = 0;
                
                // 添加产品行
                selectedProducts.forEach((product, index) => {
                    const subtotal = product.price * product.quantity;
                    totalAmount += subtotal;
                    
                    const rowHtml = `
                        <tr data-index="${index}">
                            <td>${index + 1}</td>
                            <td>${product.productName}</td>
                            <td>¥${product.price.toFixed(2)}</td>
                            <td>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <button class="btn btn-outline-secondary decrease-btn" type="button">-</button>
                                    </div>
                                    <input type="number" class="form-control quantity-input" value="${product.quantity}" min="1" max="${product.stock}">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary increase-btn" type="button">+</button>
                                    </div>
                                </div>
                            </td>
                            <td>¥<span class="subtotal">${subtotal.toFixed(2)}</span></td>
                            <td>
                                <button class="btn btn-danger btn-sm remove-btn">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    
                    $('#noProductRow').before(rowHtml);
                });
                
                // 更新总价
                $('#totalAmount').text(totalAmount.toFixed(2));
                
                // 绑定数量更改事件
                $('.quantity-input').change(function() {
                    const row = $(this).closest('tr');
                    const index = row.data('index');
                    const quantity = parseInt($(this).val());
                    
                    // 验证数量范围
                    if (isNaN(quantity) || quantity < 1) {
                        $(this).val(1);
                        selectedProducts[index].quantity = 1;
                    } else if (quantity > selectedProducts[index].stock) {
                        $(this).val(selectedProducts[index].stock);
                        selectedProducts[index].quantity = selectedProducts[index].stock;
                    } else {
                        selectedProducts[index].quantity = quantity;
                    }
                    
                    // 更新小计和总价
                    updatePrices();
                    
                    // 保存到localStorage
                    localStorage.setItem('selectedProducts', JSON.stringify(selectedProducts));
                });
                
                // 绑定减少按钮事件
                $('.decrease-btn').click(function() {
                    const row = $(this).closest('tr');
                    const index = row.data('index');
                    const input = row.find('.quantity-input');
                    let quantity = parseInt(input.val()) - 1;
                    
                    if (quantity < 1) quantity = 1;
                    
                    input.val(quantity);
                    selectedProducts[index].quantity = quantity;
                    
                    // 更新小计和总价
                    updatePrices();
                    
                    // 保存到localStorage
                    localStorage.setItem('selectedProducts', JSON.stringify(selectedProducts));
                });
                
                // 绑定增加按钮事件
                $('.increase-btn').click(function() {
                    const row = $(this).closest('tr');
                    const index = row.data('index');
                    const input = row.find('.quantity-input');
                    const stock = selectedProducts[index].stock;
                    let quantity = parseInt(input.val()) + 1;
                    
                    if (quantity > stock) quantity = stock;
                    
                    input.val(quantity);
                    selectedProducts[index].quantity = quantity;
                    
                    // 更新小计和总价
                    updatePrices();
                    
                    // 保存到localStorage
                    localStorage.setItem('selectedProducts', JSON.stringify(selectedProducts));
                });
                
                // 绑定移除按钮事件
                $('.remove-btn').click(function() {
                    const row = $(this).closest('tr');
                    const index = row.data('index');
                    
                    // 移除产品
                    selectedProducts.splice(index, 1);
                    
                    // 重新渲染产品列表
                    renderSelectedProducts();
                    
                    // 保存到localStorage
                    localStorage.setItem('selectedProducts', JSON.stringify(selectedProducts));
                });
            }
            
            // 更新产品价格
            function updatePrices() {
                let totalAmount = 0;
                
                // 遍历所有产品行，更新小计
                $('#productTable tbody tr:not(#noProductRow)').each(function(index) {
                    const quantity = selectedProducts[index].quantity;
                    const price = selectedProducts[index].price;
                    const subtotal = price * quantity;
                    
                    $(this).find('.subtotal').text(subtotal.toFixed(2));
                    totalAmount += subtotal;
                });
                
                // 更新总价
                $('#totalAmount').text(totalAmount.toFixed(2));
            }
            
            // 提交订单
            function submitOrder(status = 0) {
                if (!validateForm()) return;
                
                // 构建订单数据
                const orderData = {
                    salespersonId:currentUserId,
                    customerId: $('#customerId').val(),
                    address: $('#address').val(),
                    remark: $('#remark').val(),
                    orderStatus: status,
                    orderItems: selectedProducts.map(product => ({
                        productId: product.productId,
                        quantity: product.quantity,
                        productPrice: product.price
                    }))
                };
                
                // 发送请求
                post('/order/create', orderData).then(res => {
                    if (res.code === 200) {
                        // 清空localStorage中的产品
                        localStorage.removeItem('selectedProducts');
                        
                        // 显示成功消息
                        showMessage('订单创建成功');
                        
                        // 跳转到订单列表
                        setTimeout(() => {
                            window.location.href = '/crm/sales/order-list.html';
                        }, 1000);
                    } else {
                        showMessage(res.msg || '订单创建失败', 'error');
                    }
                });
            }
            
            // 验证表单
            function validateForm() {
                const customerId = $('#customerId').val();
                const address = $('#address').val();
                
                if (!customerId) {
                    showMessage('请选择客户', 'error');
                    return false;
                }
                
                if (!address) {
                    showMessage('请填写收货地址', 'error');
                    return false;
                }
                
                if (selectedProducts.length === 0) {
                    showMessage('请添加产品到订单中', 'error');
                    return false;
                }
                
                return true;
            }
            
            // 添加产品按钮点击事件
            $('#addProductBtn').click(function() {
                // 打开模态框
                $('#addProductModal').modal('show');
                
                // 加载产品列表
                searchProducts(1);
            });
            
            // 选择客户事件
            $('#customerId').change(function() {
                const customerId = $(this).val();
                if (customerId) {
                    loadCustomerDetails(customerId);
                } else {
                    $('#customerPhone').val('');
                    $('#address').val('');
                }
            });
            
            // 搜索产品按钮点击事件
            $('#searchProductBtn').click(function() {
                searchProducts(1);
            });
            
            // 搜索产品框回车事件
            $('#searchProductText').keypress(function(e) {
                if (e.which === 13) {
                    searchProducts(1);
                    return false;
                }
            });
            
            // 提交订单按钮点击事件
            $('#submitOrderBtn').click(function() {
                submitOrder(0); // 待付款状态
            });
            
            // 保存草稿按钮点击事件
            $('#saveOrderBtn').click(function() {
                submitOrder(0); // 待付款状态，与提交相同
            });
            
            // 取消按钮点击事件
            $('#cancelBtn').click(function() {
                if (confirm('确定要取消创建订单吗？所有输入的数据将丢失。')) {
                    // 清空localStorage中的产品
                    localStorage.removeItem('selectedProducts');
                    
                    // 返回订单列表
                    window.location.href = '/crm/sales/order-list.html';
                }
            });
            
            // 退出登录按钮事件
            $(document).on('click', '#logoutBtn', function() {
                logout();
            });
            
            // 初始化当前用户名显示
            get('/user/current').then(res => {
                if (res.code === 200 && res.data) {
                    $('#currentUsername').text(res.data.realName || res.data.username);
                    console.log(res.data.userId);
                   currentUserId = res.data.userId;
                }
